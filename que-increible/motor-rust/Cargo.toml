[package]
name = "motor-conciliacion"
version = "1.9.0"
edition = "2021"
description = "Motor de conciliación bancaria de Que Increible Compañia SL (empresa ficticia de demo)"

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
des = "0.8"
ecb = "0.1"
hmac = "0.12"
md-5 = "0.10"
ml-kem = "0.2"
openssl = "0.10"
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
rsa = "0.9"
sha1 = "0.10"
sha2 = "0.10"
jsonwebtoken = "9"
