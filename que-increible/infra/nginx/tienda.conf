# Proxy inverso de la tienda online (demo). Los quioscos de tienda llevan
# navegadores de 2014, así que se mantienen TLS 1.0 y 1.1 y suites débiles.
server {
    listen 443 ssl;
    server_name tienda.que-increible.example;

    ssl_certificate     /etc/nginx/certs/tienda.crt;
    ssl_certificate_key /etc/nginx/certs/tienda-privada.pem;

    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:DES-CBC3-SHA:RC4-SHA:AES128-SHA';
    ssl_prefer_server_ciphers on;
    ssl_dhparam /etc/nginx/certs/dhparam-1024.pem;

    location / {
        proxy_pass http://tienda-php:9000;
    }
}

# El portal nuevo: solo TLS 1.3 y, primero, el grupo híbrido post-cuántico
# X25519MLKEM768 (OpenSSL 3.5).
server {
    listen 443 ssl;
    server_name portal.que-increible.example;

    ssl_certificate     /etc/nginx/certs/portal.crt;
    ssl_certificate_key /etc/nginx/certs/portal.key;

    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1;

    location / {
        proxy_pass http://portal-ts:3000;
    }
}
